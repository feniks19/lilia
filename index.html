<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#fafafa;color:#222;padding:1.5rem;max-width:1200px;margin:auto;line-height:1.5}
h1{font-weight:500;font-size:2rem;margin-bottom:.25rem}
.subhead{color:#555;margin-bottom:1rem;border-bottom:1px solid #eaeaea;padding-bottom:1rem}
.lang{text-align:right;margin-bottom:1rem;font-weight:600}
.lang a{color:#0070f3;text-decoration:none;margin-left:.7rem}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.photo-grid figure{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #0001;transition:transform .2s;cursor:pointer}
.photo-grid figure:hover{transform:scale(1.01)}
.photo-grid img{width:100%;height:200px;object-fit:cover;object-position:top center;display:block;background:#eee}
.photo-grid figcaption{padding:.75rem 1rem 1rem;font-size:.95rem;color:#333;text-align:center;border-top:1px solid #f0f0f0}
.contact{margin-top:3rem;padding-top:1.5rem;border-top:1px solid #eaeaea;text-align:center;color:#444}
.action-buttons{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.action-buttons a{display:inline-block;background:#0070f3;color:#fff;padding:.7rem 1.8rem;border-radius:40px;text-decoration:none;font-weight:500;font-size:1.1rem;box-shadow:0 2px 8px #0070f34d}
.action-buttons a:hover{background:#005bb5}
.action-buttons .text-link{background:#34a853;box-shadow:0 2px 8px #34a8534d}
.action-buttons .text-link:hover{background:#2d8f47}
@media(max-width:480px){
h1{font-size:1.5rem}
.action-buttons a{padding:.6rem 1.4rem;font-size:1rem;width:100%}
}
</style>
</head>
<body>
<nav class="lang"><a href="index.html">ENGLISH</a><a href="index-es.html">ESPAÑOL</a><a href="index-vi.html">TIẾNG VIỆT</a></nav>
<h1>📸 4-Bedroom House for Rent</h1>
<div class="subhead">2 bathrooms · spacious living room and dining room · private parking</div>

<div class="photo-grid" id="photoGrid"></div>

<!-- Merged Full Size Modal View with Navigation Arrows -->
<div id="lightbox" style="display:none; position:fixed; z-index:1000; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center;">
    <span style="position:absolute; top:20px; right:30px; color:#fff; font-size:35px; font-weight:bold; cursor:pointer;" id="closeBtn">&times;</span>
    <button style="position:absolute; left:20px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:30px; padding:10px 20px; border-radius:5px; cursor:pointer;" id="prevBtn">&#10094;</button>
    <img id="lightboxImg" src="" alt="Full View" style="max-width:85%; max-height:85%; object-fit:contain; border-radius:4px; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
    <button style="position:absolute; right:20px; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:30px; padding:10px 20px; border-radius:5px; cursor:pointer;" id="nextBtn">&#10095;</button>
</div>

<div class="contact">
<div class="action-buttons">
<a href="tel:+16577791076">📞 Call Now</a>
<a href="sms:+17142224364" class="text-link">✉%EF%B8%8F Send a Text</a>
</div>
</div>
<script data-goatcounter="https://goatcounter.com" async src="//gc.zgo.at/count.js"></script>
<script>
const captions=[
'Spacious driveway with private parking for 4 cars',
'Clean and spacious kitchen with modern appliances',
'Central AC and heating for year-round comfort',
'Living hall furnished with cozy seating',
'Storage shelves for your supplies',
'Clean and modern flooring',
'Ventilated and fresh air',
'Extra utility sink',
'Quiet hours – respectful neighbors',
'Easy access and secure entry'
];
const grid=document.getElementById('photoGrid');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const closeBtn=document.getElementById('closeBtn');

let currentImgIndex = 0;

function updateLightboxImage(index) {
    currentImgIndex = index;
    lightboxImg.src = `images/R${index + 1}.jpg`;
}

captions.forEach((caption,i)=>{
const figure=document.createElement('figure');
const img=document.createElement('img');
img.src=`images/R${i+1}.jpg`;
img.alt=caption;
img.loading='lazy';
img.onerror=()=>img.style.display='none';
figure.append(img);
const figcap=document.createElement('figcaption');
figcap.textContent=caption;
figure.append(figcap);

// Open on Double Click
figure.addEventListener('dblclick',()=>{
updateLightboxImage(i);
lightbox.style.display='flex';
});

grid.append(figure);
});

// Navigation Functions
prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    let prevIndex = currentImgIndex - 1;
    if (prevIndex < 0) prevIndex = captions.length - 1;
    updateLightboxImage(prevIndex);
});

nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    let nextIndex = currentImgIndex + 1;
    if (nextIndex >= captions.length) nextIndex = 0;
    updateLightboxImage(nextIndex);
});

// Close functionality
closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
});
lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) lightbox.style.display = 'none';
});
</script>
</body>
</html>
