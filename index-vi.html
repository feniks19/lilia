<style>
*{margin:0;padding:0;box-sizing:border-box}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.photo-grid figure{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #0001;transition:transform .2s;cursor:pointer}
.photo-grid figure:hover{transform:scale(1.01)}
.photo-grid img{width:100%;height:200px;object-fit:cover;object-position:top center;display:block;background:#eee}
.photo-grid figcaption{padding:.75rem 1rem 1rem;font-size:.95rem;color:#333;text-align:center;border-top:1px solid #f0f0f0}
.contact{margin-top:3rem;padding-top:1.5rem;border-top:1px solid #eaeaea;text-align:center;color:#444}
.action-buttons{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.action-buttons a{display:inline-block;background:#0070f3;color:#fff;padding:.7rem 1.8rem;border-radius:40px;text-decoration:none;font-weight:500;font-size:1.1rem;box-shadow:0 2px 8px #0070f34d}
.action-buttons a:hover{background:#005bb5}
.action-buttons .text-link{background:#34a853;box-shadow:0 2px 8px #34a8534d}
.action-buttons .text-link:hover{background:#2d8f47}
@media(max-width:480px){

}

<body>

<h1>📸 Nhà Cho Thuê 4 Phòng Ngủ</h1>
<div class="subhead">2 phòng tắm · phòng khách và phòng ăn rộng rãi · bãi đậu xe riêng</div>

<div class="photo-grid" id="photoGrid"></div>

<!-- Thành phần cửa sổ xem kích thước đầy đủ -->
<div id="lightbox" style="display:none; position:fixed; z-index:1000; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; cursor:zoom-out;">
    <span style="position:absolute; top:20px; right:30px; color:#fff; font-size:35px; font-weight:bold; cursor:pointer;">&times;</span>
    <img id="lightboxImg" src="" alt="Xem Toàn Màn Hình" style="max-width:95%; max-height:95%; object-fit:contain; border-radius:4px; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
</div>

<div class="contact">
<div class="action-buttons">
<a href="tel:+16577791076">📞 Gọi Ngay</a>
<a href="sms:+17142224364" class="text-link">✉%EF%B8%8F Gửi Tin Nhắn</a>
</div>
</div>
<script data-goatcounter="https://goatcounter.com" async src="//gc.zgo.at/count.js"></script>
<script>
const captions=[
'Lối vào rộng rãi với bãi đậu xe riêng cho 4 ô tô',
'Nhà bếp sạch sẽ, rộng rãi với thiết bị hiện đại',
'Điều hòa và hệ thống sưởi trung tâm thoải mái quanh năm',
'Phòng khách được trang bị bàn ghế ấm cúng',
'Kệ lưu trữ cho vật dụng của bạn',
'Sàn nhà sạch sẽ và hiện đại',
'Thông thoáng và không khí trong lành',
'Bồn rửa tiện ích bổ sung',
'Giờ yên tĩnh – hàng xóm lịch sự',
'Lối vào dễ dàng và an toàn'
];
const grid=document.getElementById('photoGrid');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');

captions.forEach((caption,i)=>{
const figure=document.createElement('figure');
const img=document.createElement('img');
img.src=`images/R${i+1}.jpg`;
img.alt=caption;
img.loading='lazy';
img.onerror=()=>img.style.display='none';
figure.append(img);
const figcap=document.createElement('figcaption');
figcap.textContent=caption;
figure.append(figcap);

// Mở khi click đúp
figure.addEventListener('dblclick',()=>{
lightboxImg.src=img.src;
lightbox.style.display='flex';
});

grid.append(figure);
});

// Đóng khi click vào vùng đen
lightbox.addEventListener('click',()=>{
lightbox.style.display='none';
});
</script>
</body>
